# Netlify config. Vercel keeps using vercel.json + api/index.mjs.

[build]
  command = "pnpm exec vite build"
  publish = "dist/public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "pdfkit"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
